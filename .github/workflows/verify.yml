name: Verify ordering foundation
on:
  pull_request:
  push:
    branches: [fix/ordering-foundation]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local_test_only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: local_test_only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build
      - run: bun run test
      - name: Database integration checks
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/bootstrap.sql
          for migration in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql -v ON_ERROR_STOP=1 -f tests/ordering.sql
          python3 tests/concurrency.py
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Prepare the next migration filename
        run: |
          supabase --help
          supabase migration --help
          supabase migration new --help
          supabase migration new kitchen_mvp
